services:

  db:
    image: postgres:18.3-trixie
    container_name: supplier_db_18
    restart: always

    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN}

    volumes:
      - db_data:/var/lib/postgresql

    ports:
      - 5432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8090:8080

volumes:
  db_data:
